// ─── Simulation du terminal ──────────────────────────────────────────────────
// Rejoue les actions d'un scénario sur un terminal simplifié : ce qui est tapé,
// les touches courantes, et la sortie des commandes (calculée par le serveur).

function promptSegments(env) {
  const place = (ENVS.find(([v]) => v === env) || [])[2];
  if (!place) return [{ text: '> ', fg: { hex: '#5B56E0' } }]; // l'invite de VHS, sans préparation
  return [{ text: place, fg: { hex: S.prompt.place } }, { text: ' ' }, { text: S.prompt.symbol, fg: { hex: S.prompt.color } }, { text: ' ' }];
}

const speedOf = (a) => (a.speed ? seconds(a.speed) : S.values.TypingSpeed / 1000);

// Les actions datées sur le temps filmé : un passage masqué ne dure rien à l'image.
function timeline(t) {
  const events = [];
  const steps = [];
  let time = 0;
  let hidden = false;
  // Une saisie (input) arrive après la sortie de la commande en cours : on la montre d'abord.
  const at = (i, delay, fn, extra = {}) => {
    if (!hidden) time += delay;
    events.push({ time, i, fn: extra.input ? (st, ctx) => { flush(st, ctx); fn(st, ctx); } : fn, ...extra });
  };
  t.actions.forEach((a, i) => {
    const start = time;
    const wasHidden = hidden;
    switch (a.kind) {
      case 'type': for (const ch of Array.from(a.text)) at(i, speedOf(a), (st) => { st.input += ch; }, { input: true }); break;
      case 'key': for (let k = 0; k < (a.n || 1); k++) at(i, speedOf(a), (st, ctx) => pressKey(st, a.key, ctx), { input: true, enter: a.key === 'Enter' }); break;
      case 'combo': at(i, speedOf(a), (st) => pressCombo(st, a), { input: true }); break;
      case 'paste': at(i, speedOf(a), (st) => { st.input += st.clipboard; }, { input: true }); break;
      case 'copy': at(i, 0, (st) => { st.clipboard = a.text; }); break;
      case 'sleep': if (!hidden) time += a.dur; break;
      case 'wait': if (!hidden) time += 0.1; break; // la commande répond vite (estimation)
      case 'hide': hidden = true; break;
      case 'show': hidden = false; break;
      default: break;
    }
    steps.push({ start, end: time, masked: wasHidden && hidden });
  });
  // Après Entrée, la commande tourne : sa sortie apparaît à la fin du « Attendre » qui suit
  // (avant toute autre saisie), sinon un court instant après. En attendant, le curseur
  // reste au début de la ligne suivante, comme dans le vrai terminal.
  const flushes = [];
  events.forEach((ev, k) => {
    if (!ev.enter) return;
    const next = events.slice(k + 1).find((e) => e.input);
    const wait = t.actions.findIndex((a, j) => j > ev.i && a.kind === 'wait' && (!next || j < next.i));
    const when = wait >= 0 ? { time: steps[wait].end, i: wait } : { time: Math.min(ev.time + 0.15, next ? next.time : Infinity), i: ev.i };
    flushes.push({ ...when, time: Math.min(when.time, time), fn: flush, order: k + 0.5 });
  });
  events.forEach((ev, k) => { ev.order = k; });
  const all = [...events, ...flushes].sort((a, b) => a.time - b.time || a.order - b.order);
  return { events: all, steps, duration: time };
}

// Comme env.sh : lignes vides après la commande (sauf npm, qui a déjà la sienne) et
// avant l'invite suivante, sauf après clear. Sans préparation, pas de lignes vides.
const blankLines = (st) => S.prompt.blank && !!st.env;

function execute(st, ctx) {
  const command = st.input;
  const cmd = command.trim();
  st.lines.push([...promptSegments(st.env), { text: command }]);
  st.input = '';
  st.back = 0;
  if (cmd) {
    st.history.push(command);
    if (++st.count >= ctx.finalAt) st.ended = true;
  }
  if (cmd === 'clear') {
    st.lines = [];
    return;
  }
  if (!cmd) {
    if (blankLines(st) && !st.ended) st.lines.push([]);
    return;
  }
  if (blankLines(st) && !/^npm\s/.test(cmd)) st.lines.push([]);
  st.pending = { n: st.commands.push(command) - 1, cmd };
}

// La commande en cours a fini : sa sortie, puis la ligne vide avant l'invite.
function flush(st, ctx) {
  if (!st.pending) return;
  const { n, cmd } = st.pending;
  st.pending = null;
  const out = ctx.outputs ? ctx.outputs[n] : undefined;
  if (out === undefined) st.lines.push([{ text: '…', dim: true }]);
  else if (out === null) st.lines.push([{ text: `(la sortie de « ${cmd} » apparaîtra au rendu VHS)`, dim: true }]);
  else if (out !== '') st.lines.push(...parseAnsi(out.replace(/\n$/, '')));
  if (blankLines(st) && !st.ended) st.lines.push([]);
}

function pressKey(st, key, ctx) {
  if (key === 'Enter') execute(st, ctx);
  else if (key === 'Backspace') st.input = Array.from(st.input).slice(0, -1).join('');
  else if (key === 'Space') st.input += ' ';
  else if (key === 'Up' && st.history.length) {
    st.back = Math.min(st.back + 1, st.history.length);
    st.input = st.history[st.history.length - st.back];
  } else if (key === 'Down' && st.back > 0) {
    st.back--;
    st.input = st.back ? st.history[st.history.length - st.back] : '';
  }
}

function pressCombo(st, a) {
  if (a.mods !== 'Ctrl') return;
  const key = a.key.toLowerCase();
  if (key === 'c') {
    st.lines.push([...promptSegments(st.env), { text: `${st.input}^C` }]);
    if (blankLines(st)) st.lines.push([]);
    st.input = '';
  } else if (key === 'l') st.lines = [];
  else if (key === 'u') st.input = '';
}

// L'écran au moment voulu : un instant (lecture) ou la fin d'une action (sélection).
function simulate(t, tl, cursor, outputs, finalAt = t.env && t.endOnOutput ? countCommands(t, tl) : Infinity) {
  const st = { env: t.env, lines: [], input: '', history: [], back: 0, clipboard: '', commands: [], count: 0, ended: false, pending: null };
  const ctx = { outputs, finalAt };
  for (const ev of tl.events) {
    if (cursor.mode === 'time' && ev.time > cursor.time + 1e-9) break;
    if (cursor.mode === 'index' && ev.i > cursor.index) continue;
    ev.fn(st, ctx);
  }
  if (cursor.mode === 'end') flush(st, ctx);
  return st;
}

// Les commandes que le scénario exécute, dans l'ordre (pour en demander la sortie).
function commandsOf(t, tl) {
  return simulate(t, tl, { mode: 'end' }, [], Infinity).commands;
}

// Nombre de lignes de commande exécutées, clear compris : env.sh compte de la même façon.
function countCommands(t, tl = timeline(t)) {
  return simulate(t, tl, { mode: 'end' }, [], Infinity).count;
}

// Sorties des commandes : demandées au serveur un instant après la dernière frappe.
// En attendant, celles d'un calcul précédent servent pour les commandes inchangées.
function outputsFor(t, tl, cols) {
  const commands = commandsOf(t, tl);
  if (!commands.length) return [];
  const env = t.env || 'vide';
  const key = JSON.stringify([env, cols, commands]);
  if (ui.outputs.has(key)) return ui.outputs.get(key);
  if (!ui.wanted || ui.wanted.key !== key) {
    ui.wanted = { key, env, cols, commands, tape: t.name };
    clearTimeout(ui.outputTimer);
    ui.outputTimer = setTimeout(fetchOutputs, 300);
  }
  const last = ui.lastOutputs[t.name];
  return commands.map((c, i) => (last && last.commands[i] === c && last.env === env && last.cols === cols ? last.outputs[i] : undefined));
}

async function fetchOutputs() {
  const want = ui.wanted;
  if (!want) return;
  try {
    const res = await fetch('/api/outputs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ env: want.env, columns: want.cols, commands: want.commands }) });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    ui.outputs.set(want.key, json.outputs);
    ui.lastOutputs[want.tape] = { ...want, outputs: json.outputs };
  } catch (err) {
    ui.outputs.set(want.key, want.commands.map(() => null));
    setStatus(`Aperçu : sorties indisponibles (${esc(err.message)})`, 'error');
  }
  if (ui.wanted === want) ui.wanted = null;
  schedulePreview();
}

// Lignes et colonnes du terminal, mesurées par VHS (voir editor.js) : demandées un
// instant après le dernier réglage, estimées en attendant.
const GEOMETRY_SET = /^Set (Shell|FontFamily|FontSize|LineHeight|LetterSpacing|Width|Padding|Margin|WindowBar|WindowBarSize) /;

function geometryFor(t) {
  const req = { style: serializeStyle().split('\n').filter((l) => GEOMETRY_SET.test(l)).join('\n'), height: Math.round(t.height * S.scale) };
  const key = JSON.stringify(req);
  if (ui.geometry.has(key)) return ui.geometry.get(key);
  if (!ui.wantedGeometry || ui.wantedGeometry.key !== key) {
    ui.wantedGeometry = { key, req };
    clearTimeout(ui.geometryTimer);
    ui.geometryTimer = setTimeout(fetchGeometry, 500);
  }
  return null;
}

async function fetchGeometry() {
  const want = ui.wantedGeometry;
  if (!want) return;
  try {
    const res = await fetch('/api/geometry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(want.req) });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    ui.geometry.set(want.key, json);
  } catch (err) {
    ui.geometry.set(want.key, { error: err.message });
  }
  if (ui.wantedGeometry === want) ui.wantedGeometry = null;
  schedulePreview();
}

// ─── Aperçu ──────────────────────────────────────────────────────────────────
// Reproduit la composition de VHS : cadre, fenêtre, barre, marge intérieure, puis
// l'écran du terminal au moment choisi.

function applySgr(st, params) {
  const p = params === '' ? [0] : params.split(';').map(Number);
  let s = { ...st };
  for (let i = 0; i < p.length; i++) {
    const n = p[i];
    if (n === 0) s = {};
    else if (n === 1) s.bold = true;
    else if (n === 2) s.dim = true;
    else if (n === 22) { s.bold = false; s.dim = false; }
    else if (n >= 30 && n <= 37) s.fg = { i: n - 30 };
    else if (n >= 90 && n <= 97) s.fg = { i: n - 82 };
    else if (n === 39) delete s.fg;
    else if (n >= 40 && n <= 47) s.bg = { i: n - 40 };
    else if (n >= 100 && n <= 107) s.bg = { i: n - 92 };
    else if (n === 49) delete s.bg;
    else if (n === 38 || n === 48) {
      const key = n === 38 ? 'fg' : 'bg';
      if (p[i + 1] === 5) { s[key] = { i: p[i + 2] }; i += 2; }
      else if (p[i + 1] === 2) { s[key] = { rgb: p.slice(i + 2, i + 5) }; i += 4; }
    }
  }
  return s;
}

function parseAnsi(text) {
  const lines = [[]];
  let st = {};
  for (const m of text.matchAll(/\x1b\[([\d;]*)m|\x1b\[[\d;?]*[A-Za-z]|([^\x1b\n]+)|(\n)/g)) {
    if (m[1] !== undefined) st = applySgr(st, m[1]);
    else if (m[2]) lines.at(-1).push({ text: m[2], ...st });
    else if (m[3]) lines.push([]);
  }
  return lines;
}

const CUBE = [0, 95, 135, 175, 215, 255];
function resolve(c, colors, bold) {
  if (!c) return null;
  if (c.hex) return c.hex;
  if (c.rgb) return `rgb(${c.rgb.join(',')})`;
  let i = c.i;
  if (bold && i < 8) i += 8; // comme xterm.js : le gras éclaircit les 8 premières couleurs
  if (i < 16) return colors[ANSI[i]];
  if (i < 232) { const n = i - 16; return `rgb(${CUBE[Math.floor(n / 36)]},${CUBE[Math.floor(n / 6) % 6]},${CUBE[n % 6]})`; }
  const g = 8 + 10 * (i - 232);
  return `rgb(${g},${g},${g})`;
}

// Une ligne trop longue passe à la ligne, comme dans le terminal.
function wrap(line, cols) {
  const out = [[]];
  let n = 0;
  for (const seg of line) {
    if (seg.cursor) {
      if (n >= cols) { out.push([]); n = 0; }
      out.at(-1).push(seg);
      n++;
      continue;
    }
    let chars = Array.from(seg.text);
    while (chars.length) {
      if (n >= cols) { out.push([]); n = 0; }
      const take = chars.slice(0, cols - n);
      out.at(-1).push({ ...seg, text: take.join('') });
      n += take.length;
      chars = chars.slice(take.length);
    }
  }
  return out;
}

const cssFamily = (family) => `${family.split(',').map((f) => f.trim()).filter(Boolean).map((f) => `'${f.replace(/'/g, '')}'`).join(', ')}, monospace`;

const metrics = new Map();
function measure(family, size) {
  const key = `${family}|${size}`;
  if (!metrics.has(key)) {
    const probe = $('#probe');
    probe.style.font = `${size}px ${cssFamily(family)}`;
    probe.style.lineHeight = 'normal';
    probe.style.letterSpacing = '0';
    probe.textContent = 'M'.repeat(100);
    const r = probe.getBoundingClientRect();
    metrics.set(key, { advance: r.width / 100, height: r.height });
  }
  return metrics.get(key);
}

function barSvg(kind, size, width) {
  if (!kind || size <= 0) return '';
  const r = size * 0.14;
  const gap = size * 0.46;
  const first = size * 0.475;
  const right = kind.endsWith('Right');
  const rings = kind.startsWith('Rings');
  const circles = ['#FF5F58', '#FFBD2E', '#18C132'].map((color, k) => {
    const cx = right ? width - first - (2 - k) * gap : first + k * gap;
    return rings
      ? `<circle cx="${cx}" cy="${size / 2}" r="${r - 0.5}" fill="none" stroke="${color}" stroke-width="1"/>`
      : `<circle cx="${cx}" cy="${size / 2}" r="${r}" fill="${color}"/>`;
  }).join('');
  return `<svg width="${width}" height="${size}" style="position:absolute;left:0;top:0">${circles}</svg>`;
}

function segmentHtml(seg, colors, cellW, cellH) {
  if (seg.cursor) return `<span style="display:inline-block;vertical-align:top;width:${cellW}px;height:${cellH}px;background:${colors.cursor}"></span>`;
  let style = `color:${resolve(seg.fg, colors, seg.bold) || colors.foreground}`;
  if (seg.bg) style += `;background:${resolve(seg.bg, colors)}`;
  if (seg.dim) style += ';opacity:.5';
  if (seg.bold) style += ';font-weight:700';
  return `<span style="${style}">${esc(seg.text)}</span>`;
}

let previewQueued = false;
function schedulePreview() {
  if (previewQueued) return;
  previewQueued = true;
  requestAnimationFrame(() => {
    previewQueued = false;
    drawPreview();
  });
}

function drawPreview() {
  const t = currentTape();
  const frame = $('#frame');
  if (!t) {
    frame.innerHTML = '';
    frame.style.width = frame.style.height = '0px';
    $('#frame-wrap').style.width = $('#frame-wrap').style.height = '0px';
    $('#info').innerHTML = '<span class="note">Aucun GIF.</span>';
    $('#clock').textContent = '';
    return;
  }
  const v = S.values;
  const colors = S.theme.colors;
  const W = Math.max(100, v.Width);
  const H = Math.max(100, t.height);
  const margin = Math.max(0, v.Margin);
  const pad = Math.max(0, v.Padding);
  const bar = v.WindowBar ? Math.max(0, v.WindowBarSize) : 0;
  const m = measure(v.FontFamily, v.FontSize);
  // Mesuré sur des rendus VHS : ses caractères sont ~2,5 % plus larges que dans le
  // navigateur, et l'interligne 1 arrondit la hauteur de ligne au pixel supérieur.
  const cellW = m.advance * 1.025 + v.LetterSpacing;
  const cellH = Math.max(1, v.LineHeight === 1 ? Math.ceil(m.height) : Math.floor(m.height * v.LineHeight));
  const innerW = W - 2 * margin - 2 * pad;
  const innerH = H - 2 * margin - bar - 2 * pad;
  const geo = geometryFor(t);
  const measured = geo && geo.rows ? geo : null;
  const cols = measured ? measured.cols : Math.max(1, Math.floor(innerW / cellW));
  const rows = measured ? measured.rows : Math.max(1, Math.floor(innerH / cellH));
  // Dessin : des cases qui tiennent dans la fenêtre avec le nombre réel de lignes et de colonnes.
  const drawW = Math.min(cellW, innerW / cols);
  const drawH = measured ? Math.min(innerH / rows, cellH * 1.08) : cellH;

  const tl = timeline(t);
  if (ui.cursor.mode === 'index' && ui.cursor.index >= t.actions.length) ui.cursor = { mode: 'end' };
  const st = simulate(t, tl, ui.cursor, outputsFor(t, tl, cols));
  // L'invite finale est invisible, mais elle occupe une ligne du terminal.
  // Le curseur n'apparaît qu'avec l'invite : ni pendant une commande, ni après l'invite finale masquée.
  const logical = st.pending ? [...st.lines, []]
    : st.ended ? [...st.lines, []]
    : [...st.lines, [...promptSegments(t.env), { text: st.input }, { cursor: true }]];
  let wrapped = 0;
  const screen = [];
  for (const line of logical) {
    const parts = wrap(line, cols);
    if (parts.length > 1) wrapped++;
    screen.push(...parts);
  }
  const overflow = Math.max(0, screen.length - rows);
  const rowsHtml = screen.slice(overflow).map((line) =>
    `<div style="height:${drawH}px;line-height:${drawH}px">${line.map((seg) => segmentHtml(seg, colors, drawW, drawH)).join('')}</div>`).join('');

  frame.style.width = `${W}px`;
  frame.style.height = `${H}px`;
  frame.innerHTML = `
    <div style="position:absolute;inset:0;background:${margin ? v.MarginFill : colors.background}"></div>
    <div style="position:absolute;left:${margin}px;top:${margin}px;width:${W - 2 * margin}px;height:${H - 2 * margin}px;border-radius:${v.BorderRadius}px;background:${colors.background};overflow:hidden">
      ${barSvg(v.WindowBar, bar, W - 2 * margin)}
      <div style="position:absolute;left:${pad}px;top:${bar + pad}px;width:${Math.max(0, innerW)}px;height:${Math.max(0, innerH)}px;overflow:hidden;font-family:${esc(cssFamily(v.FontFamily))};font-size:${v.FontSize}px;letter-spacing:${drawW - m.advance}px;color:${colors.foreground};white-space:pre">${rowsHtml}</div>
    </div>`;
  fitFrame();

  // Moment affiché, action en cours, durées.
  const speed = v.PlaybackSpeed || 1;
  const now = ui.cursor.mode === 'time' ? ui.cursor.time : ui.cursor.mode === 'index' ? tl.steps[ui.cursor.index].end : tl.duration;
  const current = ui.cursor.mode === 'index' ? ui.cursor.index
    : ui.cursor.mode === 'time' ? tl.steps.findLastIndex((s) => s.start <= now && !s.masked) : -1;
  const scrub = $('#scrub');
  scrub.max = Math.max(0.01, tl.duration);
  scrub.value = now;
  $('#clock').textContent = `${fmtSec(now / speed)} / ${fmtSec(tl.duration / speed)}`;
  $('#play').textContent = ui.playing ? '❚❚' : '▶';
  for (const row of document.querySelectorAll('#acts .act')) {
    const i = Number(row.dataset.i);
    const step = tl.steps[i];
    if (!step) continue;
    row.classList.toggle('now', i === current);
    row.classList.toggle('masked', step.masked);
    row.querySelector('.t').textContent = step.masked ? 'caché' : fmtSec(step.start / speed);
  }

  const github = v.FontSize * Math.min(1, 880 / W);
  const info = [
    S.scale !== 1 ? `${W} × ${H} px (GIF ${W * S.scale} × ${H * S.scale})` : `${W} × ${H} px`,
    `terminal ${cols} col. × ${rows} lignes ${measured ? '(mesuré par VHS)' : geo && geo.error ? '(estimé : mesure impossible)' : '(estimé, mesure en cours…)'}`,
    `texte sur GitHub ≈ ${github.toFixed(1).replace('.', ',')} px`,
    `durée ≈ ${fmtSec(tl.duration / speed)}`,
  ].map((x) => `<span>${esc(x)}</span>`);
  if (wrapped) info.push(`<span class="warn">⚠ ${wrapped} ligne${wrapped > 1 ? 's' : ''} trop longue${wrapped > 1 ? 's' : ''} : elle${wrapped > 1 ? 's' : ''} passe${wrapped > 1 ? 'nt' : ''} à la ligne. Élargissez ou réduisez le texte.</span>`);
  if (overflow) info.push(`<span class="warn">⚠ ${overflow} ligne${overflow > 1 ? 's' : ''} sort${overflow > 1 ? 'ent' : ''} par le haut : augmentez la hauteur de ce GIF.</span>`);
  info.push('<span class="note">Aperçu approximatif : le rendu VHS fait foi.</span>');
  $('#info').innerHTML = info.join('');
}

function fitFrame() {
  const stage = $('#stage');
  const frame = $('#frame');
  const W = parseFloat(frame.style.width);
  const H = parseFloat(frame.style.height);
  if (!W || !H) return;
  const scale = Math.min(1, (stage.clientWidth - 48) / W, (stage.clientHeight - 48) / H);
  frame.style.transform = `scale(${scale})`;
  $('#frame-wrap').style.width = `${W * scale}px`;
  $('#frame-wrap').style.height = `${H * scale}px`;
}

// ─── Lecture ─────────────────────────────────────────────────────────────────

function play() {
  const t = currentTape();
  if (!t) return;
  if (ui.playing) {
    ui.playing = false;
    schedulePreview();
    return;
  }
  const tl = timeline(t);
  const step = ui.cursor.mode === 'index' ? tl.steps[ui.cursor.index] : null;
  const from = ui.cursor.mode === 'time' ? ui.cursor.time : step ? step.end : tl.duration;
  ui.cursor = { mode: 'time', time: from >= tl.duration - 0.01 ? 0 : from };
  ui.playing = true;
  setView('apercu');
  let last = performance.now();
  const tick = (now) => {
    if (!ui.playing) return;
    const duration = timeline(currentTape()).duration;
    ui.cursor = { mode: 'time', time: Math.min(duration, ui.cursor.time + ((now - last) / 1000) * (S.values.PlaybackSpeed || 1)) };
    last = now;
    if (ui.cursor.time >= duration) {
      ui.playing = false;
      ui.cursor = { mode: 'end' };
    }
    drawPreview();
    if (ui.playing) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

$('#play').onclick = play;
$('#scrub').oninput = () => {
  ui.playing = false;
  ui.cursor = { mode: 'time', time: Number($('#scrub').value) };
  schedulePreview();
};

// ─── Rendu VHS ───────────────────────────────────────────────────────────────

const renderBody = () => ({ name: ui.tape, tape: tapeText(ui.tape), style: serializeStyle() });

async function startRender() {
  if (ui.rendering || !currentTape()) return;
  const body = renderBody();
  ui.rendering = { tape: body.name, started: Date.now() };
  ui.renderError = null;
  ui.playing = false;
  setView('rendu');
  ui.timer = setInterval(drawRendu, 500);
  try {
    const res = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    ui.renders[body.name] = { ...json, at: new Date(), signature: JSON.stringify(body), width: Math.round(S.values.Width) };
  } catch (err) {
    ui.renderError = { tape: body.name, message: err.message };
  } finally {
    clearInterval(ui.timer);
    ui.rendering = null;
    drawRendu();
  }
}

function drawRendu() {
  const box = $('#rendu-box');
  $('#render').disabled = !!ui.rendering || !currentTape();
  if (ui.view !== 'rendu') return;
  const r = ui.renders[ui.tape];
  if (ui.rendering) {
    const s = Math.round((Date.now() - ui.rendering.started) / 1000);
    const other = ui.rendering.tape !== ui.tape ? ` de « ${ui.rendering.tape} »` : '';
    box.innerHTML = `<div class="spinner"></div><div>Rendu VHS${esc(other)} en cours… ${s} s</div><div class="hint">VHS joue le scénario en temps réel ; l’installation passe par le réseau.</div>`;
    return;
  }
  if (!currentTape()) {
    box.innerHTML = '<div>Aucun GIF.</div>';
    return;
  }
  if (ui.renderError?.tape === ui.tape) {
    box.innerHTML = `<div>Le rendu a échoué.</div><pre>${esc(ui.renderError.message)}</pre>`;
    box.append(renderButton('Réessayer'));
    return;
  }
  if (!r) {
    box.innerHTML = `<div>Aucun rendu pour « ${esc(ui.tape)} ».</div><div class="hint">VHS joue le scénario tel qu’il est dans la page, dans un dossier temporaire : docs/demo n’est pas modifié.</div>`;
    box.append(renderButton('Lancer le rendu VHS'));
    return;
  }
  const fresh = r.signature === JSON.stringify(renderBody());
  box.innerHTML = `<img src="${esc(r.url)}" style="width:${r.width}px" alt="Rendu VHS de ${esc(ui.tape)}">
    <div class="rendu-meta"><span>Rendu de ${r.at.toLocaleTimeString('fr-FR')} · GIF de ${fmtSec(r.duration / 1000)} · ${Math.round(r.size / 1024)} Ko · calculé en ${fmtSec(r.ms / 1000)}</span>
    <span class="badge ${fresh ? 'fresh' : 'stale'}">${fresh ? 'à jour' : 'modifié depuis'}</span></div>`;
  if (!fresh) box.querySelector('.rendu-meta').append(renderButton('Relancer'));
}

function renderButton(label) {
  const b = el('button', 'btn', label);
  b.type = 'button';
  b.onclick = startRender;
  return b;
}

function setView(view) {
  ui.view = view;
  for (const b of $('#views').children) b.classList.toggle('on', b.dataset.view === view);
  $('#frame-wrap').hidden = view !== 'apercu';
  $('#rendu-box').hidden = view !== 'rendu';
  $('#transport').hidden = view !== 'apercu';
  if (view === 'rendu') {
    ui.playing = false;
    drawRendu();
  } else schedulePreview();
}

function setPane(pane) {
  ui.pane = pane;
  for (const b of $('#panes').children) b.classList.toggle('on', b.dataset.pane === pane);
  $('#pane-scenario').hidden = pane !== 'scenario';
  $('#pane-style').hidden = pane !== 'style';
}

// ─── Enregistrement ──────────────────────────────────────────────────────────

function setStatus(html, kind = '') {
  const status = $('#status');
  status.className = `status ${kind}`;
  status.innerHTML = html;
}

async function save() {
  if (!isDirty()) return;
  $('#save').disabled = true;
  setStatus('Enregistrement…');
  try {
    const body = { style: serializeStyle(), tapes: Object.fromEntries(S.order.map((n) => [n, tapeText(n)])), deleted: [...S.deleted] };
    const res = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    load(json);
    setStatus(`Enregistré à ${new Date().toLocaleTimeString('fr-FR')}. Pour régénérer les GIFs : <code>sh docs/demo/render.sh</code>`, 'ok');
  } catch (err) {
    setStatus(`Échec de l’enregistrement : ${esc(err.message)}`, 'error');
    $('#save').disabled = false;
  }
}

// Après toute modification. `tapeChanged` : le texte du scénario affiché en mode
// texte doit suivre (description, préparation, hauteur, actions).
function changed(tapeChanged = false) {
  if (!S) return;
  const dirty = isDirty();
  $('#save').disabled = !dirty;
  $('#revert').disabled = !dirty;
  if (dirty) setStatus('● Modifications non enregistrées', 'dirty');
  else if (!$('#status').classList.contains('ok')) setStatus('');
  $('#code').textContent = serializeStyle();
  const snippet = $('#readme-snippet');
  if (snippet && currentTape()) snippet.value = readmeSnippet(currentTape());
  const savedTexts = Object.fromEntries(data.tapes.map((t) => [t.name, t.text]));
  for (const b of $('#tabs').children) b.classList.toggle('modified', savedTexts[b.dataset.name] !== tapeText(b.dataset.name));
  const area = $('#tape-text');
  if (tapeChanged && area && document.activeElement !== area) area.value = tapeText(ui.tape);
  schedulePreview();
  drawRendu();
}

// ─── Démarrage ───────────────────────────────────────────────────────────────

for (const b of $('#views').children) b.onclick = () => setView(b.dataset.view);
for (const b of $('#panes').children) b.onclick = () => setPane(b.dataset.pane);
$('#render').onclick = startRender;
$('#save').onclick = save;
$('#revert').onclick = () => { load(data); setStatus('Dernière version enregistrée rétablie.'); };
new ResizeObserver(fitFrame).observe($('#stage'));
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    save();
  } else if (e.key === ' ' && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) {
    e.preventDefault();
    play();
  }
});
window.addEventListener('beforeunload', (e) => {
  if (isDirty()) e.preventDefault();
});

(async () => {
  try {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const json = await res.json();
    await document.fonts.ready;
    load(json);
  } catch (err) {
    document.querySelector('main').innerHTML = `<p class="fatal">Impossible de charger l’éditeur : ${esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
